spring.application.name=usuario-service

server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:usuarios_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ========================================
# OAuth2 / OpenID Connect
# ========================================

app.auth.issuer=${AUTH_ISSUER:http://localhost:8081}

app.auth.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}

app.auth.redirect-uri=${AUTH_REDIRECT_URI:http://localhost:4200/auth/callback}

# Claves RSA persistentes
app.auth.keystore-path=${AUTH_KEYSTORE_PATH:.secrets/usuario-signing.p12}
app.auth.keystore-password=${AUTH_KEYSTORE_PASSWORD}
app.auth.keystore-alias=aulabreve-signing

# Sesion del servidor de autenticacion
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
